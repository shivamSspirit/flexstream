<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FlexIt Logo - Static Version (No Animation) -->

  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="1" />
      <stop offset="50%" stop-color="#9945FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00D787" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="solidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <filter id="solidGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feOffset in="coloredBlur" dx="0" dy="2" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left loop -->
  <path
    d="M 25 50 Q 25 28 38 22 Q 48 19 52 32 Q 54 42 46 48 Q 38 52 30 48 Q 25 45 25 50 Z"
    fill="url(#coinGrad)"
    filter="url(#solidGlow)"
    opacity="0.95"
  />
  <path
    d="M 30 35 Q 33 30 40 28 Q 45 27 47 34 Q 48 38 44 42 Q 39 45 35 42 Q 30 39 30 35 Z"
    fill="url(#solidGrad)"
    opacity="0.4"
  />

  <!-- Right loop -->
  <path
    d="M 75 50 Q 75 72 62 78 Q 52 81 48 68 Q 46 58 54 52 Q 62 48 70 52 Q 75 55 75 50 Z"
    fill="url(#coinGrad)"
    filter="url(#solidGlow)"
    opacity="0.95"
  />
  <path
    d="M 70 65 Q 67 70 60 72 Q 55 73 53 66 Q 52 62 56 58 Q 61 55 65 58 Q 70 61 70 65 Z"
    fill="url(#solidGrad)"
    opacity="0.4"
  />

  <!-- Center -->
  <ellipse
    cx="50"
    cy="50"
    rx="8"
    ry="12"
    fill="url(#coinGrad)"
    filter="url(#solidGlow)"
    opacity="0.95"
  />

  <!-- Hidden F -->
  <g opacity="0.9">
    <rect x="47" y="42" width="10" height="3" rx="1.5" fill="#0A0A0F" />
    <rect x="47" y="48.5" width="7" height="3" rx="1.5" fill="#0A0A0F" />
    <rect x="47" y="42" width="3" height="15" rx="1.5" fill="#0A0A0F" />
  </g>

  <!-- Static particles (no animation) -->
  <circle cx="30" cy="35" r="2" fill="#14F195" opacity="0.6" />
  <circle cx="42" cy="28" r="1.5" fill="#9945FF" opacity="0.5" />
  <circle cx="70" cy="65" r="2" fill="#00D787" opacity="0.6" />
  <circle cx="58" cy="72" r="1.5" fill="#9945FF" opacity="0.5" />
  <circle cx="50" cy="50" r="2.5" fill="#ffffff" opacity="0.9" />
</svg>
