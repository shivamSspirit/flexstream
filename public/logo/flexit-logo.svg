    <path d="M0,0 L100,0 C105,0 110,5 110,10 L110,28 C110,33 105,38 100,38 L38,38 L38,78 L88,78 C93,78 98,83 98,88 L98,106 C98,111 93,116 88,116 L38,116 L38,170 C38,175 33,180 28,180 L10,180 C5,180 0,175 0,170 Z" transform="translate(60,60)" fill="url(#jellyGrad)"/>
