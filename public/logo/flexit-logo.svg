<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 621 300" width="621" height="300">
  <defs>
    <!-- Primary jelly gradient (vertical) -->
    <linearGradient id="jellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="35%" stop-color="#4F8FFF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Glass highlight (top shine) -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom reflection -->
    <linearGradient id="bottomReflect" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft outer glow -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip paths for highlights -->
    <clipPath id="clip0">
      <path d="M0,0 L100,0 C105,0 110,5 110,10 L110,28 C110,33 105,38 100,38 L38,38 L38,78 L88,78 C93,78 98,83 98,88 L98,106 C98,111 93,116 88,116 L38,116 L38,170 C38,175 33,180 28,180 L10,180 C5,180 0,175 0,170 Z" transform="translate(60,60)"/>
    </clipPath>
    <clipPath id="clip1">
      <path d="M0,0 L28,0 C33,0 38,5 38,10 L38,170 C38,175 33,180 28,180 L10,180 C5,180 0,175 0,170 L0,10 C0,5 5,0 10,0 Z" transform="translate(178,60)"/>
    </clipPath>
    <clipPath id="clip2">
      <path d="M55,50 C25,50 0,75 0,115 C0,155 25,180 60,180 L95,180 C100,180 105,175 105,170 L105,158 C105,153 100,148 95,148 L60,148 C45,148 36,138 36,125 L36,118 L85,118 C90,118 95,113 95,108 L95,96 C95,91 90,86 85,86 L36,86 L36,82 C36,70 45,62 60,62 L95,62 C100,62 105,57 105,52 L105,60 C105,55 100,50 95,50 Z" transform="translate(224,60)"/>
