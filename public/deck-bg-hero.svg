<svg viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FlexIt Pitch Deck Background - Hero/Title Slide -->
  <!-- Dramatic background for opening slide -->

  <defs>
    <!-- Main gradient - full Solana spectrum -->
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#9945FF" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#00D787" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#14F195" stop-opacity="0.15" />
    </linearGradient>

    <!-- Radial spotlight - center focus -->
    <radialGradient id="centerSpot" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#14F195" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0" />
    </radialGradient>

    <!-- Animated particles gradient -->
    <linearGradient id="particleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14F195" />
      <stop offset="50%" stop-color="#9945FF" />
      <stop offset="100%" stop-color="#00D787" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base - premium dark background -->
  <rect width="1920" height="1080" fill="#0A0A0F"/>

  <!-- Large center spotlight -->
  <ellipse cx="960" cy="540" rx="1000" ry="800" fill="url(#centerSpot)" />

  <!-- Main gradient overlay -->
  <rect width="1920" height="1080" fill="url(#heroGrad)" />

  <!-- Decorative circles - depth layers -->
  <circle cx="960" cy="540" r="600" stroke="#9945FF" stroke-width="1" opacity="0.1" fill="none"/>
  <circle cx="960" cy="540" r="500" stroke="#14F195" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="960" cy="540" r="400" stroke="#00D787" stroke-width="1" opacity="0.06" fill="none"/>

  <!-- Floating energy particles (static positions) -->
  <circle cx="300" cy="200" r="4" fill="#14F195" opacity="0.6" filter="url(#glow)"/>
  <circle cx="500" cy="350" r="3" fill="#9945FF" opacity="0.5" filter="url(#glow)"/>
  <circle cx="1400" cy="300" r="4" fill="#00D787" opacity="0.6" filter="url(#glow)"/>
  <circle cx="1600" cy="700" r="3" fill="#14F195" opacity="0.5" filter="url(#glow)"/>
  <circle cx="400" cy="800" r="5" fill="#9945FF" opacity="0.7" filter="url(#glow)"/>
  <circle cx="1500" cy="500" r="3" fill="#00D787" opacity="0.5" filter="url(#glow)"/>

  <!-- Geometric accent lines -->
  <line x1="960" y1="0" x2="960" y2="150" stroke="url(#particleGrad)" stroke-width="2" opacity="0.2"/>
  <line x1="960" y1="930" x2="960" y2="1080" stroke="url(#particleGrad)" stroke-width="2" opacity="0.2"/>

  <!-- Corner frames for premium look -->
  <path d="M 80 80 L 80 180 M 80 80 L 180 80" stroke="#14F195" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 1840 900 L 1840 1000 M 1840 1000 L 1740 1000" stroke="#9945FF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 1840 80 L 1840 180 M 1840 80 L 1740 80" stroke="#00D787" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 80 900 L 80 1000 M 80 1000 L 180 1000" stroke="#14F195" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Subtle vignette for edge darkening -->
  <rect width="1920" height="1080" fill="radial-gradient(circle, transparent 40%, #0A0A0F 100%)" opacity="0.6"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%">
      <stop offset="40%" stop-color="#0A0A0F" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0.6" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
