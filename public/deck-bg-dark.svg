<svg viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FlexIt Pitch Deck Background - Dark Premium -->
  <!-- Perfect for Colosseum presentations -->

  <defs>
    <!-- Premium gradient overlays -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#9945FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00D787" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="bgGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#14F195" stop-opacity="0.05" />
    </linearGradient>

    <radialGradient id="spotlight1" cx="20%" cy="20%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#14F195" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#14F195" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spotlight2" cx="80%" cy="80%">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#9945FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9945FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Base background - midnight blue-black -->
  <rect width="1920" height="1080" fill="#0A0A0F"/>

  <!-- Subtle grid overlay -->
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.3"/>

  <!-- Large gradient orbs for depth -->
  <ellipse cx="384" cy="216" rx="600" ry="600" fill="url(#spotlight1)" />
  <ellipse cx="1536" cy="864" rx="600" ry="600" fill="url(#spotlight2)" />

  <!-- Diagonal gradient overlays -->
  <rect width="1920" height="1080" fill="url(#bgGrad1)" opacity="0.6"/>
  <rect width="1920" height="1080" fill="url(#bgGrad2)" opacity="0.4"/>

  <!-- Bottom gradient fade (for text readability) -->
  <rect width="1920" height="400" y="680" fill="url(#bottomFade)"/>
  <defs>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Accent lines (geometric modern style) -->
  <line x1="0" y1="80" x2="400" y2="80" stroke="url(#bgGrad1)" stroke-width="2" opacity="0.4"/>
  <line x1="1520" y1="1000" x2="1920" y2="1000" stroke="url(#bgGrad1)" stroke-width="2" opacity="0.4"/>

  <!-- Corner accent marks -->
  <path d="M 60 60 L 60 120 M 60 60 L 120 60" stroke="#14F195" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M 1860 1020 L 1860 960 M 1860 1020 L 1800 1020" stroke="#9945FF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
</svg>
