<svg viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Green-violet-green gradient for icon -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="20%" stop-color="#3B0764" />
      <stop offset="40%" stop-color="#5B21B6" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>

    <!-- Gradient for text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="30%" stop-color="#5B21B6" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
  </defs>

  <!-- Logo Icon (F shape made of capsules) -->
  <g>
    <!-- Top horizontal capsule -->
    <ellipse
      cx="28"
      cy="10"
      rx="18"
      ry="5"
      fill="url(#logoGradient)"
      transform="rotate(-2 28 10)"
    />

    <!-- Middle horizontal capsule -->
    <ellipse
      cx="22"
      cy="24"
      rx="13"
      ry="5"
      fill="url(#logoGradient)"
      opacity="0.95"
      transform="rotate(-3 22 24)"
    />

    <!-- Vertical capsule spine -->
    <ellipse
      cx="12"
      cy="24"
      rx="5"
      ry="18"
      fill="url(#logoGradient)"
    />
  </g>

  <!-- "FlexIt" Text -->
  <text x="58" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    <tspan fill="url(#textGradient)">Flex</tspan>
    <tspan fill="#F0F0F0">It</tspan>
  </text>
</svg>
