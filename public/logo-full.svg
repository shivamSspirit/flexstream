<svg viewBox="0 0 300 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FlexIt Full Logo - Icon + Text -->

  <defs>
    <!-- Premium Solana-native gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="1" />
      <stop offset="50%" stop-color="#9945FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00D787" stop-opacity="1" />
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14F195" />
      <stop offset="50%" stop-color="#9945FF" />
      <stop offset="100%" stop-color="#00D787" />
    </linearGradient>

    <!-- 3D depth gradient -->
    <linearGradient id="solidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3D glow filter -->
    <filter id="solidGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feOffset in="coloredBlur" dx="0" dy="2" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ICON (Left side) -->
  <g transform="translate(0, 0)">
    <!-- Left loop -->
    <path
      d="M 25 50 Q 25 28 38 22 Q 48 19 52 32 Q 54 42 46 48 Q 38 52 30 48 Q 25 45 25 50 Z"
      fill="url(#coinGrad)"
      filter="url(#solidGlow)"
      opacity="0.95"
    />
    <path
      d="M 30 35 Q 33 30 40 28 Q 45 27 47 34 Q 48 38 44 42 Q 39 45 35 42 Q 30 39 30 35 Z"
      fill="url(#solidGrad)"
      opacity="0.4"
    />

    <!-- Right loop -->
    <path
      d="M 75 50 Q 75 72 62 78 Q 52 81 48 68 Q 46 58 54 52 Q 62 48 70 52 Q 75 55 75 50 Z"
      fill="url(#coinGrad)"
      filter="url(#solidGlow)"
      opacity="0.95"
    />
    <path
      d="M 70 65 Q 67 70 60 72 Q 55 73 53 66 Q 52 62 56 58 Q 61 55 65 58 Q 70 61 70 65 Z"
      fill="url(#solidGrad)"
      opacity="0.4"
    />

    <!-- Center -->
    <ellipse cx="50" cy="50" rx="8" ry="12" fill="url(#coinGrad)" filter="url(#solidGlow)" opacity="0.95" />

    <!-- Hidden F -->
    <g opacity="0.9">
      <rect x="47" y="42" width="10" height="3" rx="1.5" fill="#0A0A0F" />
      <rect x="47" y="48.5" width="7" height="3" rx="1.5" fill="#0A0A0F" />
      <rect x="47" y="42" width="3" height="15" rx="1.5" fill="#0A0A0F" />
    </g>

    <!-- Energy particles -->
    <circle cx="30" cy="35" r="2" fill="#14F195">
      <animateMotion path="M 30 35 Q 35 25 45 30 Q 50 35 45 42 Q 38 47 30 42 Q 25 38 30 35" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="70" cy="65" r="2" fill="#00D787">
      <animateMotion path="M 70 65 Q 65 75 55 70 Q 50 65 55 58 Q 62 53 70 58 Q 75 62 70 65" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- TEXT (Right side) -->
  <g transform="translate(110, 50)">
    <!-- "Flex" with gradient -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-weight="900" font-size="48" fill="url(#textGrad)" letter-spacing="-0.05em">
      Flex
    </text>

    <!-- "It" in white -->
    <text x="98" y="0" font-family="Arial, sans-serif" font-weight="900" font-size="48" fill="#F5F5F7" letter-spacing="-0.05em">
      It
    </text>
  </g>
</svg>
