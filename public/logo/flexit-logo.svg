    <clipPath id="clip3">
      <path d="M0,50 L22,50 C27,50 31,53 34,57 L50,85 L66,57 C69,53 73,50 78,50 L100,50 C100,50 68,105 68,105 L100,180 L78,180 C73,180 69,177 66,173 L50,145 L34,173 C31,177 27,180 22,180 L0,180 L32,105 Z" transform="translate(337,60)"/>
    </clipPath>
    <clipPath id="clip4">
      <path d="M0,0 L28,0 C33,0 38,5 38,10 L38,170 C38,175 33,180 28,180 L10,180 C5,180 0,175 0,170 L0,10 C0,5 5,0 10,0 Z" transform="translate(445,60)"/>
    </clipPath>
    <clipPath id="clip5">
      <path d="M20,50 L20,62 L5,62 C2,62 0,64 0,67 L0,83 C0,86 2,88 5,88 L20,88 L20,145 C20,165 32,180 55,180 L65,180 C68,180 70,178 70,175 L70,158 C70,155 68,153 65,153 L55,153 C45,153 42,148 42,140 L42,88 L65,88 C68,88 70,86 70,83 L70,67 C70,64 68,62 65,62 L42,62 L42,50 C42,47 40,45 37,45 L25,45 C22,45 20,47 20,50 Z" transform="translate(491,60)"/>
    </clipPath>
  </defs>

