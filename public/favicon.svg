<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Green-violet-green gradient -->
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="20%" stop-color="#3B0764" />
      <stop offset="40%" stop-color="#5B21B6" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
  </defs>

  <!-- Background circle for better visibility -->
  <circle cx="24" cy="24" r="23" fill="#0A0A0F" />

  <!-- Top horizontal capsule - elongated pill shape -->
  <ellipse
    cx="28"
    cy="10"
    rx="18"
    ry="5"
    fill="url(#faviconGradient)"
    transform="rotate(-2 28 10)"
  />

  <!-- Middle horizontal capsule - medium pill -->
  <ellipse
    cx="22"
    cy="24"
    rx="13"
    ry="5"
    fill="url(#faviconGradient)"
    opacity="0.95"
    transform="rotate(-3 22 24)"
  />

  <!-- Vertical capsule spine - tall pill connecting bars -->
  <ellipse
    cx="12"
    cy="24"
    rx="5"
    ry="18"
    fill="url(#faviconGradient)"
  />
</svg>
