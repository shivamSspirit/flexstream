<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 725 360" width="725" height="360">
  <defs>
    <linearGradient id="jellyMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="40%" stop-color="#7B68EE"/>
      <stop offset="100%" stop-color="#9B59B6"/>
    </linearGradient>

    <linearGradient id="jellyHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#E0F7FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#B3F0FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="jellyReflect" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B3F0FF" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#B3F0FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2C1654" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clipD0">
      <path d="M0,0 L120,0 L120,32 L42,32 L42,82 L100,82 L100,114 L42,114 L42,200 L0,200 Z" transform="translate(80,80)"/>
    </clipPath>
    <clipPath id="clipD1">
      <path d="M0,0 L42,0 L42,168 L48,168 L48,200 L0,200 Z" transform="translate(216,80)"/>
    </clipPath>
    <clipPath id="clipD2">
      <path d="M60,55 C25,55 0,80 0,125 C0,170 25,200 65,200 L120,200 L120,168 L65,168 C45,168 38,155 38,145 L38,132 L95,132 L95,100 L38,100 L38,90 C38,78 48,68 65,68 L120,68 L120,55 Z" transform="translate(270,80)"/>
    </clipPath>
    <clipPath id="clipD3">
      <path d="M0,55 L30,55 L57,95 L84,55 L115,55 L75,125 L115,200 L84,200 L57,158 L30,200 L0,200 L40,125 Z" transform="translate(396,80)"/>
    </clipPath>
    <clipPath id="clipD4">
      <path d="M0,0 L42,0 L42,200 L0,200 Z" transform="translate(517,80)"/>
    </clipPath>
    <clipPath id="clipD5">
      <path d="M22,55 L22,68 L0,68 L0,100 L22,100 L22,160 C22,185 35,200 60,200 L80,200 L80,168 L60,168 C52,168 50,162 50,155 L50,100 L80,100 L80,68 L50,68 L50,55 Z" transform="translate(565,80)"/>
    </clipPath>
  </defs>

  <!-- Rich dark background -->
  <rect width="100%" height="100%" fill="#08080F"/>

  <!-- Subtle radial glow -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Soft glow behind text -->
  <g filter="url(#outerGlow)" opacity="0.6">
    <path d="M0,0 L120,0 L120,32 L42,32 L42,82 L100,82 L100,114 L42,114 L42,200 L0,200 Z" transform="translate(80,80)" fill="#00D4FF"/>
    <path d="M0,0 L42,0 L42,168 L48,168 L48,200 L0,200 Z" transform="translate(216,80)" fill="#00D4FF"/>
    <path d="M60,55 C25,55 0,80 0,125 C0,170 25,200 65,200 L120,200 L120,168 L65,168 C45,168 38,155 38,145 L38,132 L95,132 L95,100 L38,100 L38,90 C38,78 48,68 65,68 L120,68 L120,55 Z" transform="translate(270,80)" fill="#00D4FF"/>
    <path d="M0,55 L30,55 L57,95 L84,55 L115,55 L75,125 L115,200 L84,200 L57,158 L30,200 L0,200 L40,125 Z" transform="translate(396,80)" fill="#00D4FF"/>
    <path d="M0,0 L42,0 L42,200 L0,200 Z" transform="translate(517,80)" fill="#00D4FF"/>
    <path d="M22,55 L22,68 L0,68 L0,100 L22,100 L22,160 C22,185 35,200 60,200 L80,200 L80,168 L60,168 C52,168 50,162 50,155 L50,100 L80,100 L80,68 L50,68 L50,55 Z" transform="translate(565,80)" fill="#00D4FF"/>
  </g>

  <!-- Drop shadow layer -->
  <g filter="url(#dropShadow)">
    <path d="M0,0 L120,0 L120,32 L42,32 L42,82 L100,82 L100,114 L42,114 L42,200 L0,200 Z" transform="translate(80,80)" fill="#9B59B6"/>
    <path d="M0,0 L42,0 L42,168 L48,168 L48,200 L0,200 Z" transform="translate(216,80)" fill="#9B59B6"/>
    <path d="M60,55 C25,55 0,80 0,125 C0,170 25,200 65,200 L120,200 L120,168 L65,168 C45,168 38,155 38,145 L38,132 L95,132 L95,100 L38,100 L38,90 C38,78 48,68 65,68 L120,68 L120,55 Z" transform="translate(270,80)" fill="#9B59B6"/>
    <path d="M0,55 L30,55 L57,95 L84,55 L115,55 L75,125 L115,200 L84,200 L57,158 L30,200 L0,200 L40,125 Z" transform="translate(396,80)" fill="#9B59B6"/>
    <path d="M0,0 L42,0 L42,200 L0,200 Z" transform="translate(517,80)" fill="#9B59B6"/>
    <path d="M22,55 L22,68 L0,68 L0,100 L22,100 L22,160 C22,185 35,200 60,200 L80,200 L80,168 L60,168 C52,168 50,162 50,155 L50,100 L80,100 L80,68 L50,68 L50,55 Z" transform="translate(565,80)" fill="#9B59B6"/>
  </g>

  <!-- Main jelly letters -->
  <g>
    <path d="M0,0 L120,0 L120,32 L42,32 L42,82 L100,82 L100,114 L42,114 L42,200 L0,200 Z" transform="translate(80,80)" fill="url(#jellyMain)"/>
    <path d="M0,0 L42,0 L42,168 L48,168 L48,200 L0,200 Z" transform="translate(216,80)" fill="url(#jellyMain)"/>
    <path d="M60,55 C25,55 0,80 0,125 C0,170 25,200 65,200 L120,200 L120,168 L65,168 C45,168 38,155 38,145 L38,132 L95,132 L95,100 L38,100 L38,90 C38,78 48,68 65,68 L120,68 L120,55 Z" transform="translate(270,80)" fill="url(#jellyMain)"/>
    <path d="M0,55 L30,55 L57,95 L84,55 L115,55 L75,125 L115,200 L84,200 L57,158 L30,200 L0,200 L40,125 Z" transform="translate(396,80)" fill="url(#jellyMain)"/>
    <path d="M0,0 L42,0 L42,200 L0,200 Z" transform="translate(517,80)" fill="url(#jellyMain)"/>
    <path d="M22,55 L22,68 L0,68 L0,100 L22,100 L22,160 C22,185 35,200 60,200 L80,200 L80,168 L60,168 C52,168 50,162 50,155 L50,100 L80,100 L80,68 L50,68 L50,55 Z" transform="translate(565,80)" fill="url(#jellyMain)"/>
  </g>

  <!-- Glass highlight -->
  <g>
    <g clip-path="url(#clipD0)">
      <rect x="80" y="80" width="130" height="70" fill="url(#jellyHighlight)"/>
    </g>
    <g clip-path="url(#clipD1)">
      <rect x="216" y="80" width="48" height="70" fill="url(#jellyHighlight)"/>
    </g>
    <g clip-path="url(#clipD2)">
      <rect x="270" y="80" width="120" height="70" fill="url(#jellyHighlight)"/>
    </g>
    <g clip-path="url(#clipD3)">
      <rect x="396" y="80" width="115" height="70" fill="url(#jellyHighlight)"/>
    </g>
    <g clip-path="url(#clipD4)">
      <rect x="517" y="80" width="42" height="70" fill="url(#jellyHighlight)"/>
    </g>
    <g clip-path="url(#clipD5)">
      <rect x="565" y="80" width="80" height="70" fill="url(#jellyHighlight)"/>
    </g>
  </g>

  <!-- Bottom reflection -->
  <g>
    <g clip-path="url(#clipD0)">
      <rect x="80" y="230" width="130" height="50" fill="url(#jellyReflect)"/>
    </g>
    <g clip-path="url(#clipD1)">
      <rect x="216" y="230" width="48" height="50" fill="url(#jellyReflect)"/>
    </g>
    <g clip-path="url(#clipD2)">
      <rect x="270" y="230" width="120" height="50" fill="url(#jellyReflect)"/>
    </g>
    <g clip-path="url(#clipD3)">
      <rect x="396" y="230" width="115" height="50" fill="url(#jellyReflect)"/>
    </g>
    <g clip-path="url(#clipD4)">
      <rect x="517" y="230" width="42" height="50" fill="url(#jellyReflect)"/>
    </g>
    <g clip-path="url(#clipD5)">
      <rect x="565" y="230" width="80" height="50" fill="url(#jellyReflect)"/>
    </g>
  </g>

</svg>