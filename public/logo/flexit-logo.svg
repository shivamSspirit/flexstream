    <path d="M55,50 C25,50 0,75 0,115 C0,155 25,180 60,180 L95,180 C100,180 105,175 105,170 L105,158 C105,153 100,148 95,148 L60,148 C45,148 36,138 36,125 L36,118 L85,118 C90,118 95,113 95,108 L95,96 C95,91 90,86 85,86 L36,86 L36,82 C36,70 45,62 60,62 L95,62 C100,62 105,57 105,52 L105,60 C105,55 100,50 95,50 Z" transform="translate(224,60)" fill="url(#jellyGrad)"/>
