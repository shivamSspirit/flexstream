<svg viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FlexIt Logo - High Resolution Pitch Deck Version -->
  <!-- Perfect for Colosseum presentations, investor decks, and large displays -->

  <defs>
    <!-- Premium Solana-native gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="1" />
      <stop offset="50%" stop-color="#9945FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00D787" stop-opacity="1" />
    </linearGradient>

    <!-- 3D depth gradient -->
    <linearGradient id="solidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Enhanced glow for large displays -->
    <filter id="solidGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feOffset in="coloredBlur" dx="0" dy="4" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow -->
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle for depth -->
  <circle cx="600" cy="600" r="580" fill="url(#coinGrad)" opacity="0.05" filter="url(#outerGlow)" />
  <circle cx="600" cy="600" r="500" fill="url(#coinGrad)" opacity="0.08" filter="url(#outerGlow)" />

  <!-- Main Logo Group -->
  <g transform="translate(300, 300) scale(6)">
    <!-- Left loop - SOLID FILLED with 3D depth -->
    <path
      d="M 25 50 Q 25 28 38 22 Q 48 19 52 32 Q 54 42 46 48 Q 38 52 30 48 Q 25 45 25 50 Z"
      fill="url(#coinGrad)"
      filter="url(#solidGlow)"
      opacity="0.98"
    />
    <!-- Left loop inner highlight -->
    <path
      d="M 30 35 Q 33 30 40 28 Q 45 27 47 34 Q 48 38 44 42 Q 39 45 35 42 Q 30 39 30 35 Z"
      fill="url(#solidGrad)"
      opacity="0.5"
    />

    <!-- Right loop - SOLID FILLED with 3D depth -->
    <path
      d="M 75 50 Q 75 72 62 78 Q 52 81 48 68 Q 46 58 54 52 Q 62 48 70 52 Q 75 55 75 50 Z"
      fill="url(#coinGrad)"
      filter="url(#solidGlow)"
      opacity="0.98"
    />
    <!-- Right loop inner highlight -->
    <path
      d="M 70 65 Q 67 70 60 72 Q 55 73 53 66 Q 52 62 56 58 Q 61 55 65 58 Q 70 61 70 65 Z"
      fill="url(#solidGrad)"
      opacity="0.5"
    />

    <!-- Center intersection - THICK & SOLID -->
    <ellipse
      cx="50"
      cy="50"
      rx="8"
      ry="12"
      fill="url(#coinGrad)"
      filter="url(#solidGlow)"
      opacity="0.98"
    />

    <!-- THE HIDDEN "F" - Solid filled negative space -->
    <g opacity="0.95">
      <rect x="47" y="42" width="10" height="3" rx="1.5" fill="#0A0A0F" />
      <rect x="47" y="48.5" width="7" height="3" rx="1.5" fill="#0A0A0F" />
      <rect x="47" y="42" width="3" height="15" rx="1.5" fill="#0A0A0F" />
    </g>

    <!-- Energy particles - larger for visibility -->
    <circle cx="30" cy="35" r="2.5" fill="#14F195">
      <animateMotion
        path="M 30 35 Q 35 25 45 30 Q 50 35 45 42 Q 38 47 30 42 Q 25 38 30 35"
        dur="3s"
        repeatCount="indefinite"
      />
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
    </circle>

    <circle cx="42" cy="28" r="2" fill="#9945FF">
      <animateMotion
        path="M 42 28 Q 46 26 48 32 Q 48 38 44 40 Q 38 42 34 38 Q 30 34 42 28"
        dur="2.5s"
        repeatCount="indefinite"
      />
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <circle cx="70" cy="65" r="2.5" fill="#00D787">
      <animateMotion
        path="M 70 65 Q 65 75 55 70 Q 50 65 55 58 Q 62 53 70 58 Q 75 62 70 65"
        dur="3s"
        repeatCount="indefinite"
      />
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
    </circle>

    <circle cx="58" cy="72" r="2" fill="#9945FF">
      <animateMotion
        path="M 58 72 Q 54 74 52 68 Q 52 62 56 60 Q 62 58 66 62 Q 70 66 58 72"
        dur="2.8s"
        repeatCount="indefinite"
      />
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Center spark -->
    <circle cx="50" cy="50" r="3" fill="#ffffff" opacity="1">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
