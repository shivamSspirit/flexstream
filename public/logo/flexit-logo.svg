    <path d="M0,0 L28,0 C33,0 38,5 38,10 L38,170 C38,175 33,180 28,180 L10,180 C5,180 0,175 0,170 L0,10 C0,5 5,0 10,0 Z" transform="translate(445,60)" fill="#00D4FF"/>
